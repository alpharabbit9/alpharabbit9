name: Refresh GitHub stats

on:
  schedule:
    # 02:17 UTC daily (~08:17 Asia/Dhaka). Odd minute — GitHub drops jobs
    # queued on the hour when the scheduler is busy.
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-cards.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats and activity cards
        env:
          # GH_STATS_TOKEN — optional classic PAT (scopes: repo, read:user).
          # With it the card also counts private repositories and private
          # contributions. Without it the built-in token is used and only
          # public activity is counted.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: alpharabbit9
        run: node scripts/generate-cards.mjs

      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/activity.svg
          if git diff --staged --quiet; then
            echo "Stats unchanged — nothing to commit."
          else
            git commit -m "chore(stats): refresh GitHub stats and activity cards"
            git push
          fi
